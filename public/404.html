<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found (404) | Neominds</title>
  <meta name="description" content="The page you requested could not be found. Explore Neominds enterprise engineering and AI solutions." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#2258E7" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background-color: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 2px;
      color: #dc2626;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 16px;
      color: #0f172a;
    }
    p {
      font-size: 17px;
      line-height: 1.6;
      color: #475067;
      max-width: 540px;
      margin: 0 auto 36px auto;
    }
    .actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 26px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 2px;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background-color: #2258e7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #183c9e;
    }
    .btn-secondary {
      background-color: #f8fafc;
      color: #0f172a;
      border: 1px solid #d0d3dd;
    }
    .btn-secondary:hover {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div>
    <div class="badge">Error 404 • Route Not Found</div>
    <h1>The requested page does not exist</h1>
    <p>The URL you followed may have been updated or relocated. You can return to our homepage or contact our engineering team directly.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Return to Homepage</a>
      <a href="/contacts" class="btn btn-secondary">Contact Engineering Team</a>
    </div>
  </div>
</body>
</html>
